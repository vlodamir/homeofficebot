<style>
  #team-vacation-timeline { margin: 0; }
  #team-vacation-timeline figcaption p { color: var(--muted-foreground); }
  #team-vacation-timeline table { width: 100%; table-layout: fixed; border-spacing: 0; margin-top: var(--font-size-base); }
  #team-vacation-timeline .people { width: clamp(98px, 29%, 168px); }
  #team-vacation-timeline th, #team-vacation-timeline td { padding: calc(var(--font-size-base) * .5) 0; }
  #team-vacation-timeline th { font-weight: 500; }
  #team-vacation-timeline th .text-small { display: block; color: var(--muted-foreground); font-weight: 400; }
  #team-vacation-timeline thead th { text-align: center; }
  #team-vacation-timeline tbody th { text-align: left; padding-right: 4px; }
  #team-vacation-timeline td { border-top: 1px solid var(--border); border-right: 1px solid var(--border); }
  #team-vacation-timeline .today { background-color: var(--muted); }
  #team-vacation-timeline .bar { position: relative; }
  #team-vacation-timeline .bar::before {
    content: "";
    position: absolute;
    inset: 50% -1px auto 0;
    height: var(--font-size-base);
    transform: translateY(-50%);
    background-color: var(--viz-series-1);
  }
  #team-vacation-timeline .start::before { left: 3px; border-radius: 4px 0 0 4px; }
  #team-vacation-timeline .end::before { right: 3px; border-radius: 0 4px 4px 0; }
</style>
